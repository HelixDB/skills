interface:
  display_name: "Helix Query MCP"
  short_description: "Run brokered Helix Cloud queries"
  default_prompt: "Use $helix-query-mcp to run the explicitly requested query against the authorized Helix Cloud database."

dependencies:
  tools:
    - type: "mcp"
      value: "helix-db"
      description: "Unified Helix Cloud MCP endpoint"
      transport: "streamable_http"
      url: "https://mcp.helix-db.com/mcp"

policy:
  allow_implicit_invocation: false
