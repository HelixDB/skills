interface:
  display_name: "Helix Foundry Onboarding"
  short_description: "Set up a Helix Foundry ontology end to end"
  default_prompt: "Use $helix-foundry-onboarding to set up my Helix Foundry ontology: connect our data, make API sources or upload our documents, write its goal, then generate, review and load it."

dependencies:
  tools:
    - type: "mcp"
      value: "helix-db"
      description: "Hosted Helix Cloud MCP server"
      transport: "streamable_http"
      url: "https://mcp.helix-db.com/mcp"

policy:
  allow_implicit_invocation: false
