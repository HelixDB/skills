interface:
  display_name: "Helix MCP"
  short_description: "Inspect live Helix Cloud observability"
  default_prompt: "Use $helix-mcp to inspect my Helix Cloud database active indexes and recent query performance."

dependencies:
  tools:
    - type: "mcp"
      value: "helix-db"
      description: "Hosted read-only Helix Cloud MCP server"
      transport: "streamable_http"
      url: "https://mcp.dev.helix-db.com/mcp"

policy:
  allow_implicit_invocation: true
