interface:
  display_name: "Helix Foundry Actions MCP"
  short_description: "Run confirmed Helix Foundry actions"
  default_prompt: "Use $helix-foundry-actions-mcp for the exact Helix Foundry sync, generation, answer to a draft's questions, revision, document upload, version, load, new ontology, API source, dashboard or workflow change I asked for."

dependencies:
  tools:
    - type: "mcp"
      value: "helix"
      description: "Helix MCP server (unified Helix Cloud and Foundry tools)"
      transport: "streamable_http"
      url: "https://mcp.helix-db.com/mcp"

policy:
  allow_implicit_invocation: false
